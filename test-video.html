<!DOCTYPE html>
<html>
<head>
    <title>Video Processing Test</title>
</head>
<body>
    <h1>Video Processing Test</h1>
    <input type="file" id="videoInput" accept="video/*" />
    <div id="result"></div>
    
    <script>
        document.getElementById('videoInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            console.log('Processing video:', file.name, file.type, file.size);
            
            try {
                // Test the video processing function
                const frames = await extractVideoFrames(file);
                console.log('Frames extracted:', frames.length);
                
                const resultDiv = document.getElementById('result');
                resultDiv.innerHTML = `<h2>Success! Extracted ${frames.length} frame(s)</h2>`;
                
                frames.forEach((frame, index) => {
                    const img = document.createElement('img');
                    img.src = frame;
                    img.style.width = '200px';
                    img.style.margin = '10px';
                    img.style.border = '1px solid #ccc';
                    resultDiv.appendChild(img);
                });
                
            } catch (error) {
                console.error('Video processing failed:', error);
                document.getElementById('result').innerHTML = `<h2>Error: ${error.message}</h2>`;
            }
        });
        
        // Copy the video processing function here for testing
        async function extractVideoFrames(file, maxFrames = 2, frameInterval = 1) {
            console.log(`extractVideoFrames called for: ${file.name}, type: ${file.type}, size: ${file.size}`);
            
            // Check if file type is supported
            const supportedTypes = [
                'video/mp4',
                'video/webm',
                'video/ogg',
                'video/avi',
                'video/mov',
                'video/quicktime'
            ];
            
            if (!supportedTypes.includes(file.type.toLowerCase())) {
                console.warn(`Unsupported video format: ${file.type} for file ${file.name}`);
                return [];
            }
            
            // Use video element to extract actual frames
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                if (!ctx) {
                    console.error('Could not get canvas context');
                    reject(new Error('Could not get canvas context'));
                    return;
                }
                
                const frames = [];
                let resolved = false;
                
                // Set a timeout to prevent hanging
                const timeout = setTimeout(() => {
                    if (!resolved) {
                        console.log(`Video frame extraction timed out for ${file.name}, returning ${frames.length} frames`);
                        resolved = true;
                        resolve(frames.length > 0 ? frames : []);
                    }
                }, 10000); // 10 second timeout
                
                const cleanup = () => {
                    if (video.src) {
                        URL.revokeObjectURL(video.src);
                    }
                };
                
                video.onloadedmetadata = () => {
                    console.log(`Video metadata loaded for ${file.name}: duration=${video.duration}s, dimensions=${video.videoWidth}x${video.videoHeight}`);
                    
                    const duration = video.duration;
                    if (isNaN(duration) || duration <= 0) {
                        console.error(`Invalid video duration: ${duration}`);
                        clearTimeout(timeout);
                        cleanup();
                        if (!resolved) {
                            resolved = true;
                            resolve([]);
                        }
                        return;
                    }
                    
                    // Extract frame at 1 second or middle of video
                    const time = Math.min(1, Math.max(0.1, duration / 2));
                    console.log(`Seeking to ${time}s for frame extraction`);
                    video.currentTime = time;
                };
                
                video.onseeked = () => {
                    console.log(`Video seeked to ${video.currentTime}s for ${file.name}`);
                    
                    try {
                        // Set canvas dimensions to video dimensions
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        
                        // Draw video frame to canvas
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        
                        // Convert to base64
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        frames.push(dataUrl);
                        
                        console.log(`Successfully extracted frame from video ${file.name} at ${video.currentTime}s`);
                        clearTimeout(timeout);
                        cleanup();
                        
                        if (!resolved) {
                            resolved = true;
                            resolve(frames);
                        }
                    } catch (error) {
                        console.error(`Error drawing video frame for ${file.name}:`, error);
                        clearTimeout(timeout);
                        cleanup();
                        if (!resolved) {
                            resolved = true;
                            resolve([]);
                        }
                    }
                };
                
                video.onerror = (e) => {
                    console.error(`🚨 VIDEO ERROR for ${file.name} 🚨`);
                    console.error(`Event object:`, e);
                    console.error(`Timestamp:`, new Date().toISOString());
                    
                    // Log the actual error details from video.error
                    if (video.error) {
                        console.error(`❌ ACTUAL ERROR DETAILS:`, {
                            code: video.error.code,
                            message: video.error.message
                        });
                    } else {
                        console.error(`❌ No video.error available`);
                    }
                    
                    console.error(`📊 VIDEO STATE:`, {
                        networkState: video.networkState,
                        readyState: video.readyState,
                        src: video.src,
                        currentSrc: video.currentSrc,
                        videoWidth: video.videoWidth,
                        videoHeight: video.videoHeight,
                        duration: video.duration,
                        currentTime: video.currentTime,
                        paused: video.paused,
                        ended: video.ended,
                        seeking: video.seeking
                    });
                    
                    console.error(`📁 FILE INFO:`, {
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        lastModified: new Date(file.lastModified).toISOString()
                    });
                    
                    // Create a placeholder image for the video file
                    console.log(`Creating placeholder for ${file.name} since video processing failed`);
                    try {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        if (ctx) {
                            canvas.width = 640;
                            canvas.height = 480;
                            
                            // Create a placeholder image
                            ctx.fillStyle = '#f0f0f0';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            
                            // Add border
                            ctx.strokeStyle = '#ccc';
                            ctx.lineWidth = 2;
                            ctx.strokeRect(0, 0, canvas.width, canvas.height);
                            
                            // Add text
                            ctx.fillStyle = '#333';
                            ctx.font = 'bold 20px Arial';
                            ctx.textAlign = 'center';
                            ctx.fillText('Video Content', canvas.width / 2, canvas.height / 2 - 20);
                            
                            ctx.font = '16px Arial';
                            ctx.fillText(file.name, canvas.width / 2, canvas.height / 2 + 10);
                            
                            ctx.font = '14px Arial';
                            ctx.fillText('Video file uploaded', canvas.width / 2, canvas.height / 2 + 30);
                            
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                            
                            clearTimeout(timeout);
                            cleanup();
                            if (!resolved) {
                                resolved = true;
                                resolve([dataUrl]);
                            }
                        } else {
                            clearTimeout(timeout);
                            cleanup();
                            if (!resolved) {
                                resolved = true;
                                resolve([]);
                            }
                        }
                    } catch (placeholderError) {
                        console.error('Failed to create placeholder:', placeholderError);
                        clearTimeout(timeout);
                        cleanup();
                        if (!resolved) {
                            resolved = true;
                            resolve([]);
                        }
                    }
                };
                
                // Configure video element for better compatibility
                video.muted = true;
                video.playsInline = true;
                video.controls = false;
                video.preload = 'metadata';
                video.crossOrigin = 'anonymous';
                video.defaultMuted = true;
                
                // Load video
                try {
                    const objectURL = URL.createObjectURL(file);
                    video.src = objectURL;
                    
                    console.log(`Loading video ${file.name} from object URL: ${objectURL}`);
                    console.log(`Video file details:`, {
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        lastModified: new Date(file.lastModified).toISOString(),
                        objectURL: objectURL
                    });
                    
                    video.load();
                } catch (loadError) {
                    console.error(`Failed to load video ${file.name}:`, loadError);
                    clearTimeout(timeout);
                    cleanup();
                    if (!resolved) {
                        resolved = true;
                        resolve([]);
                    }
                }
            });
        }
    </script>
</body>
</html>
